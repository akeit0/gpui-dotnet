[package]
name = "gpui-dotnet"
version = "0.1.0-preview.1"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
async-channel = "2"
unicode-segmentation = "1.13.3"

[target.'cfg(not(target_os = "ios"))'.dependencies]
# crates.io 0.2.2 predates the Windows IME fix in Zed PR #41259.
# Return to a crates.io version after that fix is included in a release.
gpui-desktop = { package = "gpui", git = "https://github.com/zed-industries/zed", rev = "2ead8c42fb6792095d7cb02f7b89e467421dc8a0" }

[target.'cfg(target_os = "ios")'.dependencies]
gpui-mobile-core = { package = "gpui-pre", version = "=0.3.6", default-features = false }
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", rev = "f379bc81a2c55e0634bfd6625263a235578986c3", default-features = false, features = [
    "camera",
    "video_player",
] }
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
# Compile Metal shaders through Apple's Metal runtime on macOS. This keeps native builds
# working with the Command Line Tools SDK, which ships the macOS headers/frameworks but not
# Xcode's standalone `metal` compiler executable.
gpui-desktop = { package = "gpui", git = "https://github.com/zed-industries/zed", rev = "2ead8c42fb6792095d7cb02f7b89e467421dc8a0", features = [
    "runtime_shaders",
] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.61", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
csbindgen = "1.9.8"

[target.'cfg(not(target_os = "ios"))'.dev-dependencies]
gpui-desktop = { package = "gpui", git = "https://github.com/zed-industries/zed", rev = "2ead8c42fb6792095d7cb02f7b89e467421dc8a0", features = [
    "test-support",
] }
