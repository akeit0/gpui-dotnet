[package]
name = "gpui-dotnet-components-host"
version.workspace = true
edition = "2024"
publish = false

[lib]
name = "gpui_dotnet_components"
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui = { package = "gpui-pre", version = "0.3.1" }
gpui-component = { path = "../../../../external/gpui-kit/crates/component" }
gpui-kit-assets = { path = "../../../../external/gpui-kit/crates/assets" }
gpui-dotnet = { path = "../.." }
gpui-dotnet-editor-provider = { path = "../editor-provider" }
serde_json = "1"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "0.3.1", features = ["test-support"] }

[lints]
workspace = true
