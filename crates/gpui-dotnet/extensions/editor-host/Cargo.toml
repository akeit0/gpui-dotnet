[package]
name = "gpui-dotnet-editor-host"
version.workspace = true
edition = "2024"
publish = false

[lib]
name = "gpui_dotnet_editor"
crate-type = ["cdylib"]

[dependencies]
gpui = { package = "gpui-pre", version = "0.3.1" }
gpui-component = { path = "../../../../external/gpui-kit/crates/component", features = ["tree-sitter-rust"] }
gpui-dotnet = { path = "../.." }
ropey = "=2.0.0-beta.1"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "0.3.1", features = ["test-support"] }

[lints]
workspace = true
