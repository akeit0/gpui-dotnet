name: Set up native build
description: Install the shared CI Rust toolchain, native dependencies, and Cargo cache.
runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes \
          clang \
          cmake \
          gcc \
          g++ \
          libasound2-dev \
          libfontconfig-dev \
          libssl-dev \
          libstdc++-14-dev \
          libvulkan1 \
          libwayland-dev \
          libx11-xcb-dev \
          libxkbcommon-x11-dev \
          libzstd-dev

    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: 1.98.0
        components: rustfmt

    - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      with:
        workspaces: crates/gpui-dotnet
