name: Release NuGet packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated packages to NuGet.org
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release tag to validate when dispatching from a tag
        required: false
        type: string
        default: ''
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: nuget-release
  cancel-in-progress: false

jobs:
  native:
    name: Native ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            library: crates/gpui-dotnet/target/release/gpui_dotnet.dll
          - runner: ubuntu-24.04
            rid: linux-x64
            library: crates/gpui-dotnet/target/release/libgpui_dotnet.so
          - runner: macos-15-intel
            rid: osx-x64
            library: crates/gpui-dotnet/target/release/libgpui_dotnet.dylib
          - runner: macos-14
            rid: osx-arm64
            library: crates/gpui-dotnet/target/release/libgpui_dotnet.dylib
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            gcc \
            g++ \
            libasound2-dev \
            libfontconfig-dev \
            libssl-dev \
            libstdc++-14-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libzstd-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: crates/gpui-dotnet

      - name: Test native library
        run: cargo test --manifest-path crates/gpui-dotnet/Cargo.toml

      - name: Build native library
        shell: pwsh
        run: ./eng/build-native.ps1 -ManifestPath crates/gpui-dotnet/Cargo.toml -Configuration release

      - name: Stage native library
        shell: pwsh
        run: ./eng/stage-native.ps1 -Rid ${{ matrix.rid }} -Library ${{ matrix.library }}

      - name: Upload native library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}
          if-no-files-found: error

  package:
    name: Validate packages
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify release package version
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          [xml] $props = Get-Content Directory.Build.props
          $version = [string] $props.Project.PropertyGroup.Version
          $tag = $env:RELEASE_TAG
          if ($tag -match '^[vV]') { $tag = $tag.Substring(1) }
          if ($tag -ne $version) {
              throw "Release tag '$($env:RELEASE_TAG)' must match package version '$version' (optional leading 'v')."
          }

      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libfontconfig-dev \
            libssl-dev \
            libstdc++-14-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libzstd-dev

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.400

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-win-x64
          path: artifacts/native/win-x64

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-linux-x64
          path: artifacts/native/linux-x64

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-osx-x64
          path: artifacts/native/osx-x64

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-osx-arm64
          path: artifacts/native/osx-arm64

      - name: Verify generated bindings
        run: dotnet run --project tools/Gpui.Bindings.Generator -- verify

      - name: Build managed projects
        run: dotnet build Gpui.slnx -c Release --no-incremental -p:BuildGpuiNative=false

      - name: Test managed projects
        run: dotnet test tests/Gpui.Tests/Gpui.Tests.csproj -c Release --no-build

      - name: Pack and validate package family
        shell: pwsh
        run: ./eng/pack.ps1 -Configuration Release

      - name: Restore package in a clean project
        shell: pwsh
        run: |
          [xml] $props = Get-Content Directory.Build.props
          $version = [string] $props.Project.PropertyGroup.Version
          dotnet new console --framework net10.0 --output artifacts/package-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smokeProject = 'artifacts/package-smoke/package-smoke.csproj'
          $rid = 'linux-x64'
          $nugetSource = 'https://api.nuget.org/v3/index.json'
          $packageSource = (Resolve-Path -LiteralPath 'artifacts/packages').Path
          $nugetConfig = 'artifacts/package-smoke/NuGet.Config'
          $packagesPath = 'artifacts/package-smoke/packages'
          @'
          using Gpui.Interop;

          var runtime = NativeRuntime.Load();
          Console.WriteLine($"Loaded {runtime.GetType().FullName} from GPUI.NET packages.");
          '@ | Set-Content -LiteralPath artifacts/package-smoke/Program.cs -Encoding utf8
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$packageSource" />
              <add key="nuget.org" value="$nugetSource" />
            </packageSources>
          </configuration>
          "@ | Set-Content -LiteralPath $nugetConfig -Encoding utf8
          dotnet add $smokeProject package GPUI.NET `
              --version $version `
              --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore $smokeProject --configfile $nugetConfig --packages $packagesPath --runtime $rid
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $smokeProject --runtime $rid --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project $smokeProject --runtime $rid --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  windows-consumer:
    name: Validate Windows NuGet consumer
    needs: package
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.400

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-packages
          path: artifacts/packages

      - name: Restore and build clean Windows consumer
        shell: pwsh
        run: |
          [xml] $props = Get-Content Directory.Build.props
          $version = [string] $props.Project.PropertyGroup.Version
          dotnet new console --framework net10.0 --output artifacts/package-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smokeProject = 'artifacts/package-smoke/package-smoke.csproj'
          $rid = 'win-x64'
          $nugetSource = 'https://api.nuget.org/v3/index.json'
          $packageSource = (Resolve-Path -LiteralPath 'artifacts/packages').Path
          $nugetConfig = 'artifacts/package-smoke/NuGet.Config'
          $packagesPath = 'artifacts/package-smoke/packages'
          @'
          using Gpui.Interop;

          var runtime = NativeRuntime.Load();
          Console.WriteLine($"Loaded {runtime.GetType().FullName} from GPUI.NET packages.");
          '@ | Set-Content -LiteralPath artifacts/package-smoke/Program.cs -Encoding utf8
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$packageSource" />
              <add key="nuget.org" value="$nugetSource" />
            </packageSources>
          </configuration>
          "@ | Set-Content -LiteralPath $nugetConfig -Encoding utf8
          dotnet add $smokeProject package GPUI.NET `
              --version $version `
              --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore $smokeProject --configfile $nugetConfig --packages $packagesPath --runtime $rid
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Windows application manifests are consumer-owned; this job validates restore and build only.
          dotnet build $smokeProject --runtime $rid --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  macos-consumer:
    name: Validate ${{ matrix.rid }} NuGet consumer
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            rid: osx-x64
          - runner: macos-14
            rid: osx-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.400

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-packages
          path: artifacts/packages

      - name: Restore, build, and run clean macOS consumer
        shell: pwsh
        run: |
          [xml] $props = Get-Content Directory.Build.props
          $version = [string] $props.Project.PropertyGroup.Version
          dotnet new console --framework net10.0 --output artifacts/package-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smokeProject = 'artifacts/package-smoke/package-smoke.csproj'
          $rid = '${{ matrix.rid }}'
          $nugetSource = 'https://api.nuget.org/v3/index.json'
          $packageSource = (Resolve-Path -LiteralPath 'artifacts/packages').Path
          $nugetConfig = 'artifacts/package-smoke/NuGet.Config'
          $packagesPath = 'artifacts/package-smoke/packages'
          @'
          using Gpui.Interop;

          var runtime = NativeRuntime.Load();
          Console.WriteLine($"Loaded {runtime.GetType().FullName} from GPUI.NET packages.");
          '@ | Set-Content -LiteralPath artifacts/package-smoke/Program.cs -Encoding utf8
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$packageSource" />
              <add key="nuget.org" value="$nugetSource" />
            </packageSources>
          </configuration>
          "@ | Set-Content -LiteralPath $nugetConfig -Encoding utf8
          dotnet add $smokeProject package GPUI.NET `
              --version $version `
              --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore $smokeProject --configfile $nugetConfig --packages $packagesPath --runtime $rid
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $smokeProject --runtime $rid --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project $smokeProject --runtime $rid --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish:
    name: Publish to NuGet.org
    if: inputs.publish || github.event_name == 'release'
    needs: [package, windows-consumer, macos-consumer]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Require the main branch
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag == '' && github.ref != 'refs/heads/main'
        shell: pwsh
        run: throw 'Publishing is only allowed from the main branch.'

      - name: Require release commit on main
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: pwsh
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
              throw 'Publishing a GitHub Release requires its tag commit to be contained in main.'
          }

      - name: Require selected release tag
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $tags = @(git tag --points-at HEAD)
          if ($env:RELEASE_TAG -notin $tags) {
              throw "Workflow ref '$($env:GITHUB_REF)' does not point at release tag '$($env:RELEASE_TAG)'."
          }

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.400

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-packages
          path: artifacts/packages

      - name: NuGet login
        id: nuget_login
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          Get-ChildItem artifacts/packages -Filter '*.nupkg' -File |
              Sort-Object Name -Descending |
              ForEach-Object {
                  dotnet nuget push $_.FullName `
                      --api-key $env:NUGET_API_KEY `
                      --source 'https://api.nuget.org/v3/index.json' `
                      --skip-duplicate
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              }
