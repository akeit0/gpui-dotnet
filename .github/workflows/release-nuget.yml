name: Release NuGet packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated packages to NuGet.org
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nuget-release
  cancel-in-progress: false

jobs:
  native:
    name: Native ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            library: crates/gpui-dotnet/target/release/gpui_dotnet.dll
          - runner: ubuntu-24.04
            rid: linux-x64
            library: crates/gpui-dotnet/target/release/libgpui_dotnet.so
          - runner: macos-15-intel
            rid: osx-x64
            library: crates/gpui-dotnet/target/release/libgpui_dotnet.dylib
          - runner: macos-14
            rid: osx-arm64
            library: crates/gpui-dotnet/target/release/libgpui_dotnet.dylib
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            gcc \
            g++ \
            libasound2-dev \
            libfontconfig-dev \
            libssl-dev \
            libstdc++-14-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libzstd-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/gpui-dotnet

      - name: Test native library
        run: cargo test --manifest-path crates/gpui-dotnet/Cargo.toml

      - name: Build native library
        shell: pwsh
        run: ./eng/build-native.ps1 -ManifestPath crates/gpui-dotnet/Cargo.toml -Configuration release

      - name: Stage native library
        shell: pwsh
        run: ./eng/stage-native.ps1 -Rid ${{ matrix.rid }} -Library ${{ matrix.library }}

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}
          if-no-files-found: error

  package:
    name: Validate packages
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: artifacts/native/win-x64

      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: artifacts/native/linux-x64

      - uses: actions/download-artifact@v4
        with:
          name: native-osx-x64
          path: artifacts/native/osx-x64

      - uses: actions/download-artifact@v4
        with:
          name: native-osx-arm64
          path: artifacts/native/osx-arm64

      - name: Verify generated bindings
        run: dotnet run --project tools/Gpui.Bindings.Generator -- verify

      - name: Build managed projects
        run: dotnet build Gpui.slnx -c Release --no-incremental -p:BuildGpuiNative=false

      - name: Test managed projects
        run: dotnet test tests/Gpui.Tests/Gpui.Tests.csproj -c Release --no-build

      - name: Pack and validate package family
        shell: pwsh
        run: ./eng/pack.ps1 -Configuration Release

      - name: Restore package in a clean project
        shell: pwsh
        run: |
          [xml] $props = Get-Content Directory.Build.props
          $version = [string] $props.Project.PropertyGroup.Version
          dotnet new console --framework net10.0 --output artifacts/package-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet add artifacts/package-smoke/package-smoke.csproj package GPUI.NET `
              --version $version `
              --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore artifacts/package-smoke/package-smoke.csproj `
              --source artifacts/packages `
              --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build artifacts/package-smoke/package-smoke.csproj --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish to NuGet.org
    if: inputs.publish
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: throw 'Publishing is only allowed from the main branch.'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages

      - name: NuGet login
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          Get-ChildItem artifacts/packages -Filter '*.nupkg' -File |
              Sort-Object Name -Descending |
              ForEach-Object {
                  dotnet nuget push $_.FullName `
                      --api-key $env:NUGET_API_KEY `
                      --source https://api.nuget.org/v3/index.json `
                      --skip-duplicate
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              }
