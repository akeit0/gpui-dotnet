name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/gpui-dotnet-native

      - name: Verify semantic bindings
        run: dotnet run --project tools/Gpui.Bindings.Generator -- verify

      - name: Test native bridge
        run: cargo test --manifest-path native/gpui-dotnet-native/Cargo.toml

      - name: Build solution
        run: dotnet build gpui-dotnet.slnx --no-incremental

      - name: Test managed contract and generator
        run: dotnet test dotnet/tests/Gpui.Net.Tests/Gpui.Net.Tests.csproj --no-build

      - name: NativeAOT publish smoke test
        run: dotnet publish dotnet/samples/Gpui.Net.Sample/Gpui.Net.Sample.csproj -c Release -r win-x64 -p:PublishAot=true
