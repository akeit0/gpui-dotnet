name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            library: crates/gpui-dotnet/target/release/gpui_dotnet.dll
          - runner: ubuntu-24.04
            rid: linux-x64
            library: crates/gpui-dotnet/target/release/libgpui_dotnet.so
          - runner: macos-15-intel
            rid: osx-x64
            library: crates/gpui-dotnet/target/release/libgpui_dotnet.dylib
          - runner: macos-14
            rid: osx-arm64
            library: crates/gpui-dotnet/target/release/libgpui_dotnet.dylib
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Configure faster native validation builds
        shell: pwsh
        run: |
          $cargoDirectory = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME '.cargo' }
          New-Item -ItemType Directory -Force -Path $cargoDirectory | Out-Null
          $cargoConfig = Join-Path $cargoDirectory 'config.toml'
          Get-Content eng/cargo-validation.toml -Raw | Add-Content -LiteralPath $cargoConfig

      - uses: ./.github/actions/setup-native

      - name: Restore formatting tool
        run: dotnet tool restore

      - name: Check managed formatting
        run: dotnet csharpier check .

      - name: Check native formatting
        run: cargo fmt --manifest-path crates/gpui-dotnet/Cargo.toml -- --check

      - name: Check editor host formatting
        run: cargo fmt --manifest-path crates/gpui-dotnet/extensions/editor-host/Cargo.toml -- --check

      - name: Verify package versions
        shell: pwsh
        run: ./eng/check-version.ps1

      - name: Verify semantic bindings
        run: dotnet run --project tools/Gpui.Bindings.Generator -- verify

      - name: Test native workspace
        run: cargo test --locked --manifest-path crates/gpui-dotnet/Cargo.toml --workspace

      - name: Verify one GPUI dependency
        run: cargo tree --locked --manifest-path crates/gpui-dotnet/Cargo.toml --invert gpui

      - name: Build native hosts together
        run: cargo build --locked --manifest-path crates/gpui-dotnet/Cargo.toml --workspace

      - name: Build solution
        run: dotnet build Gpui.slnx --no-incremental -m:1 -p:GpuiNativePrebuilt=true

      - name: Test managed contract and generator
        run: dotnet test tests/Gpui.Tests/Gpui.Tests.csproj --no-build --no-restore

      - name: NativeAOT publish smoke test
        if: runner.os == 'Windows'
        run: dotnet publish samples/Gpui.Sample/Gpui.Sample.csproj -c Release -r win-x64 -p:PublishAot=true -p:NativeCargoProfile=debug -p:GpuiNativePrebuilt=true

      - name: Build release native asset
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./eng/build-native.ps1 -ManifestPath crates/gpui-dotnet/Cargo.toml -Configuration release

      - name: Check generated files are unchanged
        run: git diff --exit-code

      - name: Stage release native asset
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./eng/stage-native.ps1 -Rid ${{ matrix.rid }} -Library ${{ matrix.library }}

      - name: Upload native asset
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}
          if-no-files-found: error
