name: MoonBit contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'moonbit/**'
      - 'bindings/**'
      - 'tools/Gpui.Bindings.Generator/**'
      - 'tools/gpui-abi-gen/**'
      - 'tools/moonbit.py'
      - 'tests/moonbit/**'
      - 'crates/gpui-dotnet/src/abi.rs'
      - 'src/Gpui.Editor/schema.json'
      - '.github/workflows/moonbit-contracts.yml'

permissions:
  contents: read

jobs:
  c-boundary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - run: python tools/moonbit.py static-test
      - run: python tools/moonbit.py c-test
      - run: python tools/moonbit.py c-test --cc clang --sanitize
        if: runner.os == 'Linux'

  generators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: python tools/moonbit.py generator-test
      - run: python tools/moonbit.py abi-test
      - run: python tools/moonbit.py verify
      # MoonBit compilation and real GPUI GUI tests are separate release gates.
      # This workflow makes no claim to install or pin a verified MoonBit compiler.
