name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0-preview.1
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  create:
    name: Create release
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Require the main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "The release workflow must be run from main; selected ref: $GITHUB_REF" >&2
            exit 1
          fi

      - name: Verify release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [xml] $props = Get-Content -LiteralPath Directory.Build.props
          $version = [string] $props.Project.PropertyGroup.Version
          $tag = $env:RELEASE_TAG.Trim()
          if ($tag -match '^[vV]') { $tag = $tag.Substring(1) }
          if ($tag -ne $version) {
              throw "Release tag '$($env:RELEASE_TAG)' must match package version '$version' (optional leading 'v')."
          }

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release '$RELEASE_TAG' already exists; reusing it."
          else
            release_args=(
              "$RELEASE_TAG"
              --target "$GITHUB_SHA"
              --title "$RELEASE_TAG"
              --generate-notes
            )
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "${release_args[@]}"
          fi

          gh workflow run release-nuget.yml --ref "$RELEASE_TAG" --field publish=true --field release_tag="$RELEASE_TAG"
